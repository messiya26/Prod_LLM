services:
  - type: web
    name: llm-api
    runtime: node
    region: ohio
    rootDir: apps/api
    buildCommand: npm install --production && npx prisma generate
    startCommand: npx prisma db push --skip-generate --accept-data-loss && node dist/main.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        value: "false"
      - key: FRONTEND_URL
        value: "https://lordlomboministries.com"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: "https://prod-llm.onrender.com/api/v1/auth/google/callback"
